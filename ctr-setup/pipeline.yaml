# Containers: build, scan and sign one app image (namespace agentic-patching). Started by the AAP job
# "CTR - Build and Scan" (and once per app by ctr-setup/deploy.py for the first images).
#
#   clone    OpenShift Pipelines' git-clone: the app's GitLab repo at a branch (fix/<run>, or main)
#   package  mvn package through the Nexus proxies (maven-central, and the Lightwell repositories): target/lib
#   build    OpenShift Pipelines' buildah: the app's Containerfile, pushed to the internal registry
#   scan     roxctl image check (Central reads the image through its internal-registry integration). With
#            enforce=true a policy failure (a fixable critical CVE) fails the run before anything is deployed
#   sign     cosign, with the key pair in secret ctr-cosign (no transparency-log upload: a lab key, not keyless)
#
# Results: IMAGE_DIGEST, IMAGE_URL, SCAN_SUMMARY.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ctr-package
  namespace: agentic-patching
spec:
  params:
    - { name: nexus_url, type: string }
  workspaces:
    - { name: source }
  steps:
    - name: mvn-package
      image: registry.access.redhat.com/ubi9/openjdk-17:latest
      workingDir: $(workspaces.source.path)
      computeResources: { requests: { cpu: 300m, memory: 768Mi }, limits: { cpu: "2", memory: 2Gi } }
      env:
        - { name: HOME, value: $(workspaces.source.path)/.home }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p "$HOME"
        N="$(params.nexus_url)"
        cat > "$HOME/settings.xml" <<XML
        <settings>
          <mirrors><mirror><id>nexus-central</id><mirrorOf>central</mirrorOf><url>$N/repository/maven-central/</url></mirror></mirrors>
          <profiles><profile><id>lightwell</id><repositories><repository><id>lightwell-demo-remediated</id>
            <url>$N/repository/lightwell-demo-remediated/</url></repository><repository><id>lightwell-remediated</id>
            <url>$N/repository/lightwell-remediated/</url></repository></repositories></profile></profiles>
          <activeProfiles><activeProfile>lightwell</activeProfile></activeProfiles>
        </settings>
        XML
        # Once more on failure: a cold Nexus proxy can time out the first fetch of an artifact it then serves.
        mvn -B -ntp -s "$HOME/settings.xml" -Dmaven.repo.local="$HOME/.m2" -DskipTests package \
          || mvn -B -ntp -s "$HOME/settings.xml" -Dmaven.repo.local="$HOME/.m2" -DskipTests package
        echo "jars in the image:"; ls target/lib
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ctr-scan
  namespace: agentic-patching
spec:
  params:
    - { name: image, type: string }
    - { name: enforce, type: string, default: "true" }
    # CVEs the Lightwell build in this image fixes (comma-separated, from the Lightwell API). ACS matches a jar by its
    # upstream version (5.3.18.rhlw-00010 reads as 5.3.18, "fixed in 5.3.26") and cannot see the backport, so its
    # policies flag CVEs the build has fixed. Those are waived here, by name; anything else still fails the check.
    - { name: lightwell_fixed, type: string, default: "" }
  results:
    - { name: SCAN_SUMMARY, type: string }
  steps:
    - name: roxctl-check
      image: registry.access.redhat.com/ubi9/python-311:latest
      computeResources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      env:
        - name: ROX_ENDPOINT
          valueFrom: { secretKeyRef: { name: ctr-acs, key: endpoint } }
        - name: ROX_API_TOKEN
          valueFrom: { secretKeyRef: { name: ctr-acs, key: token } }
        - { name: IMAGE, value: $(params.image) }
        - { name: ENFORCE, value: $(params.enforce) }
        - { name: LIGHTWELL_FIXED, value: $(params.lightwell_fixed) }
        - { name: RESULT, value: $(results.SCAN_SUMMARY.path) }
      script: |
        #!/usr/bin/env python3
        import json, os, re, ssl, subprocess, sys, urllib.request
        ep, tok = os.environ['ROX_ENDPOINT'], os.environ['ROX_API_TOKEN']
        # roxctl from the Central itself, so its version always matches.
        ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
        req = urllib.request.Request(f'https://{ep}/api/cli/download/roxctl-linux', headers={'Authorization': f'Bearer {tok}'})
        open('/tmp/roxctl', 'wb').write(urllib.request.urlopen(req, context=ctx, timeout=120).read()); os.chmod('/tmp/roxctl', 0o755)
        # Central reads the image through its integration for the internal registry (ctr-setup/acs-registry.yaml).
        r = subprocess.run(['/tmp/roxctl', 'image', 'check', '--image', os.environ['IMAGE'], '-e', f'{ep}:443',
                            '--insecure-skip-tls-verify', '-o', 'json'], capture_output=True, text=True,
                           env={**os.environ, 'ROX_API_TOKEN': tok})
        try:
            out = json.loads(r.stdout)
        except ValueError:
            msg = f'roxctl image check did not run: {(r.stderr or r.stdout).strip()[-300:]}'
            print(msg); open(os.environ['RESULT'], 'w').write(msg[:400]); sys.exit(1 if os.environ['ENFORCE'] == 'true' else 0)
        waived = {c.strip() for c in os.environ.get('LIGHTWELL_FIXED', '').split(',') if c.strip()}
        failing, left, seen = [], set(), set()
        for res in out.get('results') or []:
            for pol in res.get('violatedPolicies') or []:
                cves = set(re.findall(r'CVE-\d{4}-\d+', ' '.join(pol.get('violation') or [])))
                seen |= cves
                print(f"policy {pol.get('name')} ({pol.get('severity')}, {'breaks build' if pol.get('failingCheck') else 'informs'}): "
                      f"{len(cves)} CVE(s)" + (f", {len(cves & waived)} fixed by the Lightwell build" if cves else ''))
                if pol.get('failingCheck'):
                    rest = cves - waived
                    if rest or not cves:                  # a failing policy that is not about waived CVEs still fails
                        failing.append(pol.get('name')); left |= rest
        n_w = len(seen & waived)
        if failing:
            msg = (f"roxctl: {', '.join(failing)} failing" + (f" on {len(left)} CVE(s) not fixed by Lightwell ({', '.join(sorted(left)[:5])})" if left else '')
                   + (f"; {n_w} CVE(s) waived (fixed by the Lightwell build, ACS matches the upstream version)" if n_w else ''))
        else:
            msg = 'roxctl image check passed' + (f'; {n_w} CVE(s) waived: fixed by the Lightwell build (ACS matches the upstream version)' if n_w else '')
        print(msg)
        open(os.environ['RESULT'], 'w').write(msg[:400])
        if failing and os.environ['ENFORCE'] == 'true':
            print('stopping before anything is deployed'); sys.exit(1)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ctr-sign
  namespace: agentic-patching
spec:
  params:
    - { name: image, type: string }
  steps:
    - name: cosign-sign
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      computeResources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      env:
        - name: COSIGN_PASSWORD
          valueFrom: { secretKeyRef: { name: ctr-cosign, key: cosign.password } }
        - name: COSIGN_KEY
          valueFrom: { secretKeyRef: { name: ctr-cosign, key: cosign.key } }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        V=v2.4.1
        cd /tmp   # saved under its release name: the checksum file refers to it by that name
        curl -fsSL -o cosign-linux-amd64 "https://github.com/sigstore/cosign/releases/download/$V/cosign-linux-amd64"
        curl -fsSL -o cosign.sha "https://github.com/sigstore/cosign/releases/download/$V/cosign_checksums.txt"
        grep ' cosign-linux-amd64$' cosign.sha | sha256sum -c - && chmod +x cosign-linux-amd64 && mv cosign-linux-amd64 /tmp/cosign
        printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
        # Registry credentials written directly: cosign login has no insecure-registry flag, cosign sign does.
        REG=image-registry.openshift-image-registry.svc:5000
        export HOME=/tmp DOCKER_CONFIG=/tmp/.docker && mkdir -p "$DOCKER_CONFIG"
        AUTH=$(printf 'serviceaccount:%s' "$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" | base64 -w0)
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$REG" "$AUTH" > "$DOCKER_CONFIG/config.json"
        /tmp/cosign sign --yes --key /tmp/cosign.key --tlog-upload=false --allow-insecure-registry "$(params.image)"
        echo "signed $(params.image)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ctr-build
  namespace: agentic-patching
spec:
  params:
    - { name: repo_url, type: string }
    - { name: revision, type: string, default: main }
    - { name: app, type: string }
    - { name: tag, type: string }
    - { name: nexus_url, type: string }
    - { name: enforce, type: string, default: "true" }
    - { name: lightwell_fixed, type: string, default: "" }
  workspaces:
    - { name: source }
    - { name: git-auth }
  results:
    - { name: IMAGE_DIGEST, value: $(tasks.build.results.IMAGE_DIGEST) }
    - { name: IMAGE_URL, value: $(tasks.build.results.IMAGE_URL) }
    - { name: SCAN_SUMMARY, value: $(tasks.scan.results.SCAN_SUMMARY) }
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: namespace, value: openshift-pipelines }
      params:
        - { name: URL, value: $(params.repo_url) }
        - { name: REVISION, value: $(params.revision) }
      workspaces:
        - { name: output, workspace: source }
        - { name: basic-auth, workspace: git-auth }
    - name: package
      runAfter: [clone]
      taskRef: { name: ctr-package }
      params:
        - { name: nexus_url, value: $(params.nexus_url) }
      workspaces:
        - { name: source, workspace: source }
    - name: build
      runAfter: [package]
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: buildah }
          - { name: namespace, value: openshift-pipelines }
      params:
        - name: IMAGE
          value: image-registry.openshift-image-registry.svc:5000/agentic-patching/$(params.app):$(params.tag)
        - { name: DOCKERFILE, value: ./Containerfile }
        - { name: TLSVERIFY, value: "false" }
      workspaces:
        - { name: source, workspace: source }
    - name: scan
      runAfter: [build]
      taskRef: { name: ctr-scan }
      params:
        - name: image
          value: image-registry.openshift-image-registry.svc:5000/agentic-patching/$(params.app)@$(tasks.build.results.IMAGE_DIGEST)
        - { name: enforce, value: $(params.enforce) }
        - { name: lightwell_fixed, value: $(params.lightwell_fixed) }
    - name: sign
      runAfter: [scan]
      taskRef: { name: ctr-sign }
      params:
        - name: image
          value: image-registry.openshift-image-registry.svc:5000/agentic-patching/$(params.app)@$(tasks.build.results.IMAGE_DIGEST)
