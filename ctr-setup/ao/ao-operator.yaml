# Automation Orchestrator operator for the Containers side (ctr-setup/install-aap-ao.sh). It supports only the
# AllNamespaces install mode, so it is subscribed in openshift-operators (the cluster-wide OperatorGroup); the AO
# instance itself lives in namespace ao.
apiVersion: v1
kind: Namespace
metadata:
  name: ao
  labels: { app.kubernetes.io/part-of: agentic-patching }
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: automation-orchestrator-operator
  namespace: openshift-operators
spec:
  name: automation-orchestrator-operator
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
