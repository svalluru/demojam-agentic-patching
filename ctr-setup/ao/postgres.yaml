# One small PostgreSQL 15 for Automation Orchestrator (bring-your-own database): databases ao (backend) and temporal
# (+ temporal_visibility), one owner. Credentials come from secret ao-postgres (created by install-aap-ao.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ao-postgres-init
  namespace: ao
data:
  # Run by the rhel9/postgresql-15 image at every start: the extra databases, idempotently.
  create-dbs.sh: |
    for db in temporal temporal_visibility; do
      psql -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1 || psql -c "CREATE DATABASE $db OWNER \"$POSTGRESQL_USER\""
    done
---
apiVersion: v1
kind: Service
metadata:
  name: ao-postgres
  namespace: ao
spec:
  selector: { app: ao-postgres }
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ao-postgres
  namespace: ao
spec:
  serviceName: ao-postgres
  replicas: 1
  selector: { matchLabels: { app: ao-postgres } }
  template:
    metadata: { labels: { app: ao-postgres } }
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRESQL_DATABASE, value: ao }
            - name: POSTGRESQL_USER
              valueFrom: { secretKeyRef: { name: ao-postgres, key: username } }
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: ao-postgres, key: password } }
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ao-postgres, key: admin-password } }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { exec: { command: ["/usr/libexec/check-container"] }, initialDelaySeconds: 10, periodSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/pgsql/data }
            - { name: init, mountPath: /opt/app-root/src/postgresql-start }
      volumes:
        - name: init
          configMap: { name: ao-postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-csi
        resources: { requests: { storage: 10Gi } }
