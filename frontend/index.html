<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Patching Console</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0b1020; --panel:#151c33; --surface:#1a2340; --text:#e7ecff;
    --muted:#8492b8; --accent:#6ea8fe; --border:#2a355f;
    --red:#ff6b6b; --orange:#ffa94d; --yellow:#ffd43b; --green:#51cf66;
  }
  body {
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo {
    width: 32px; height: 32px; background: var(--accent); border-radius: 9px;
    display: grid; place-items: center; font-weight: 800; color: var(--bg);
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 7px;
            font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .dot.off { background: var(--red); }

  /* two frames */
  .frames {
    flex: 1; display: grid; grid-template-columns: 380px 1fr;
    gap: 16px; padding: 16px 20px; min-height: 0;
  }
  .frame {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; display: flex; flex-direction: column;
    overflow: hidden; min-height: 0;
  }
  .frame-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .frame-head h2 { font-size: 14px; font-weight: 700; }
  .frame-body { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
  .frame-body::-webkit-scrollbar { width: 6px; }
  .frame-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ---- frame 1: input ---- */
  label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .5px;
          text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  input[type=text] {
    width: 100%; padding: 11px 13px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
  }
  input[type=text]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110,168,254,.18);
  }
  .hint { font-size: 11px; color: var(--muted); margin-top: 7px; line-height: 1.5; }
  button.primary {
    width: 100%; margin-top: 14px; padding: 11px;
    background: var(--accent); color: var(--bg); border: none; border-radius: 9px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.primary:hover { opacity: .9; }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  .result {
    margin-top: 16px; padding: 12px 14px; border-radius: 9px;
    font-size: 12px; line-height: 1.55; display: none; border-left: 3px solid;
  }
  .result.show { display: block; }
  .result.ok   { background: rgba(81,207,102,.08);  border-color: var(--green);  color: var(--green); }
  .result.err  { background: rgba(255,107,107,.08); border-color: var(--red);    color: var(--red); }
  .result.info { background: rgba(110,168,254,.08); border-color: var(--accent); color: var(--accent); }
  .result code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px; }

  /* ---- frame 2: list ---- */
  .pills { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .view-toggle { margin-left: auto; }
  .pills + .view-toggle, .view-toggle + .pills { margin-left: 8px; }
  .pill {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 20px;
    background: transparent; color: var(--muted);
    font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent); color: var(--text); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .pill .n {
    display: inline-block; min-width: 16px; padding: 0 4px; margin-left: 5px;
    border-radius: 10px; font-size: 10px; line-height: 16px; text-align: center;
    background: rgba(255,255,255,.15);
  }
  .pill.active .n { background: rgba(0,0,0,.22); }

  .sev-block { margin-bottom: 20px; }
  .sev-block:last-child { margin-bottom: 0; }
  .sev-title {
    display: flex; align-items: center; gap: 9px; margin-bottom: 9px;
    font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
  }
  .sev-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .sev-title .c { font-weight: 700; color: var(--muted); letter-spacing: 0; }
  .critical { color: var(--red); }  .high { color: var(--orange); }
  .medium   { color: var(--yellow); } .low  { color: var(--green); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 6px 8px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  td { padding: 8px; font-size: 12px; border-bottom: 1px solid rgba(42,53,95,.5); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface); }
  tbody tr.sel { background: rgba(110,168,254,.12); }
  .cve-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-weight: 700; white-space: nowrap; }
  .cvss { font-weight: 700; }
  .desc { color: var(--muted); max-width: 380px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exploit { font-size: 9px; font-weight: 800; color: var(--red); margin-left: 5px; }

  .pager { display: flex; align-items: center; justify-content: space-between;
           padding-top: 14px; font-size: 12px; color: var(--muted); }
  .pager button {
    padding: 5px 13px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center;
           height: 100%; gap: 9px; color: var(--muted); font-size: 13px; text-align: center; }
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- dry-run report ---- */
  .run-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .run-head h3 { font-size: 14px; font-weight: 700; }
  .run-head #patch { margin-left: auto; }
  .go-patch {
    padding: 6px 16px; background: var(--green); color: var(--bg);
    border: none; border-radius: 7px; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  .go-patch:hover { opacity: .9; }
  .go-patch:disabled { opacity: .45; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border);
          border-radius: 9px; padding: 10px; text-align: center; }
  .stat .v { font-size: 20px; font-weight: 800; line-height: 1.2; }
  .stat .k { font-size: 9px; font-weight: 700; letter-spacing: .5px;
             text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .verdict { padding: 12px 15px; border-radius: 9px; border-left: 3px solid; }
  .verdict.warn { background: rgba(255,169,77,.07); border-color: var(--orange); }
  .verdict.ok   { background: rgba(81,207,102,.07); border-color: var(--green); }
  .v-title { font-size: 13px; font-weight: 700; letter-spacing: -.1px; }
  .verdict.warn .v-title { color: var(--orange); }
  .verdict.ok   .v-title { color: var(--green); }
  .v-detail { font-size: 12px; color: var(--text); opacity: .85; margin-top: 3px; line-height: 1.5; }
  .v-meta { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 10px;
            padding-top: 9px; border-top: 1px solid var(--border);
            font-size: 11.5px; color: var(--text); }
  .v-meta .k { display: block; font-size: 9px; font-weight: 700; letter-spacing: .6px;
               text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .note { font-size: 11px; color: var(--muted); margin-top: 7px; line-height: 1.5; }
  .badge { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
  .badge.review { background: rgba(255,169,77,.14); color: var(--orange); }
  .badge.ok     { background: rgba(81,207,102,.14); color: var(--green); }
  .badge.fail   { background: rgba(255,107,107,.14); color: var(--red); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  .btn-approve, .btn-reject {
    padding: 3px 11px; border: none; border-radius: 6px; font-size: 11px;
    font-weight: 700; cursor: pointer; margin-right: 5px;
  }
  .btn-approve { background: var(--green); color: var(--bg); }
  .btn-reject  { background: var(--red);   color: #fff; }
  .btn-approve:disabled, .btn-reject:disabled { opacity: .4; cursor: not-allowed; }
  .muted-sm { font-size: 11px; color: var(--muted); }
  .err-sm   { font-size: 11px; color: var(--red); }
  .desc { white-space: normal; }
  /* agent trace — who called whom, in order */
  .trace { margin-top: 16px; padding: 11px 13px; background: var(--surface);
           border: 1px solid var(--border); border-radius: 9px;
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
           font-size: 10.5px; line-height: 1.75; color: var(--muted); }
  .t-from { color: var(--accent); font-weight: 700; }
  .t-to   { color: var(--green);  font-weight: 700; }
  .t-arrow { color: var(--muted); margin: 0 5px; }

  @media (max-width: 860px) { .frames { grid-template-columns: 1fr; }
                              .stats { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>

<header>
  <div class="logo">AP</div>
  <h1>Agentic Patching Console</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
</header>

<div class="frames">

  <!-- Frame 1 — enter a CVE -->
  <section class="frame">
    <div class="frame-head"><h2>Patch a CVE</h2></div>
    <div class="frame-body">
      <label for="cve">CVE ID</label>
      <input type="text" id="cve" placeholder="CVE-2026-12405" autocomplete="off" spellcheck="false">
      <div class="hint">Type a CVE ID, or click one in the list to fill this in.</div>
      <button class="primary" id="go">Assess CVE Impact</button>
      <div class="result" id="result"></div>
    </div>
  </section>

  <!-- Frame 2 — CVE list, grouped into severity blocks -->
  <section class="frame">
    <div class="frame-head">
      <h2 id="frame-title">CVEs</h2>
      <button class="pill view-toggle" id="view-runs">Patch runs</button>
      <div class="pills" id="pills">
        <button class="pill active" data-sev="all">All</button>
        <button class="pill" data-sev="critical">Critical</button>
        <button class="pill" data-sev="high">High</button>
        <button class="pill" data-sev="medium">Medium</button>
        <button class="pill" data-sev="low">Low</button>
      </div>
    </div>
    <div class="frame-body" id="list">
      <div class="empty"><div class="spinner"></div><span>Loading CVEs from Insights…</span></div>
    </div>
  </section>

</div>

<script>
const SEVS = ['critical', 'high', 'medium', 'low'];
let cves = [], filter = 'all', offset = 0, pageSize = 20, hasMore = false, total = 0;

const esc = v => {
  if (v === null || v === undefined || v === '') return '—';
  const d = document.createElement('span'); d.textContent = String(v); return d.innerHTML;
};
const severity = cvss => {
  const n = parseFloat(cvss);
  if (isNaN(n)) return 'low';
  return n >= 9 ? 'critical' : n >= 7 ? 'high' : n >= 4 ? 'medium' : 'low';
};
const fmtDate = s => {
  try { return new Date(s).toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'}); }
  catch { return s || '—'; }
};

function setStatus(text, ok) {
  document.getElementById('status').textContent = text;
  document.getElementById('dot').className = 'dot' + (ok ? '' : ' off');
}

function show(msg, kind) {
  const el = document.getElementById('result');
  el.className = 'result show ' + kind;
  el.innerHTML = msg;
}

async function loadCves(next) {
  if (typeof next === 'number') offset = Math.max(0, next);
  document.getElementById('list').innerHTML =
    '<div class="empty"><div class="spinner"></div><span>Loading CVEs from Insights…</span></div>';
  try {
    const r = await fetch(`/api/cves?limit=${pageSize}&offset=${offset}`);
    const d = await r.json();
    if (d.ok === false) throw new Error(d.error || 'request failed');
    cves = d.cves || [];
    hasMore = !!d.has_more;
    total = d.total_items || 0;
    offset = d.offset ?? offset;
    setStatus(`${total.toLocaleString()} CVEs`, true);
  } catch (e) {
    cves = [];
    setStatus('Insights unavailable', false);
    document.getElementById('list').innerHTML =
      `<div class="empty"><span>Could not load CVEs</span>`
      + `<span style="font-size:11px">${esc(e.message)}</span></div>`;
    return;
  }
  render();
}

function counts() {
  const c = { all: cves.length, critical: 0, high: 0, medium: 0, low: 0 };
  cves.forEach(v => c[severity(v.cvss)]++);
  return c;
}

function rows(list) {
  return `<table>
    <thead><tr><th>CVE</th><th>CVSS</th><th>Impact</th><th>Affected</th><th>Published</th><th>Description</th></tr></thead>
    <tbody>${list.map(c => `
      <tr data-id="${esc(c.id)}">
        <td class="cve-id">${esc(c.id)}${c.known_exploit ? '<span class="exploit">EXPLOIT</span>' : ''}</td>
        <td class="cvss ${severity(c.cvss)}">${esc(c.cvss)}</td>
        <td>${esc(c.impact)}</td>
        <td>${esc(c.systems_affected)}</td>
        <td style="white-space:nowrap">${esc(fmtDate(c.public_date))}</td>
        <td class="desc">${esc((c.description || '').slice(0, 110))}</td>
      </tr>`).join('')}</tbody></table>`;
}

function render() {
  const c = counts();
  document.querySelectorAll('#pills .pill').forEach(p => {
    const k = p.dataset.sev;
    p.classList.toggle('active', k === filter);
    p.querySelector('.n')?.remove();
    if (c[k]) p.insertAdjacentHTML('beforeend', `<span class="n">${c[k]}</span>`);
  });

  const el = document.getElementById('list');
  // One block per severity so the groups read as blocks, not one flat table.
  const visible = filter === 'all' ? SEVS : [filter];
  let html = visible.map(sev => {
    const group = cves.filter(v => severity(v.cvss) === sev);
    if (!group.length) return '';
    return `<div class="sev-block">
      <div class="sev-title ${sev}">${sev}<span class="c">${group.length}</span></div>
      ${rows(group)}
    </div>`;
  }).join('');

  if (!html) html = '<div class="empty"><span>No CVEs of this severity on this page.</span></div>';

  const from = cves.length ? offset + 1 : 0;
  html += `<div class="pager">
    <span>Showing ${from}–${offset + cves.length}${total ? ' of ' + total.toLocaleString() : ''}</span>
    <span>
      <button id="prev" ${offset <= 0 ? 'disabled' : ''}>Previous</button>
      <button id="next" ${hasMore ? '' : 'disabled'}>Next</button>
    </span></div>`;

  el.innerHTML = html;
  el.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => {
    el.querySelectorAll('tbody tr').forEach(r => r.classList.remove('sel'));
    tr.classList.add('sel');
    document.getElementById('cve').value = tr.dataset.id;
    document.getElementById('result').className = 'result';
  }));
  document.getElementById('prev')?.addEventListener('click', () => loadCves(offset - pageSize));
  document.getElementById('next')?.addEventListener('click', () => loadCves(offset + pageSize));
}

function renderTrace(events) {
  if (!events || !events.length) return '';
  return `<div class="trace">${events.map(e =>
    `<div><span class="t-from">${esc(e.from)}</span>`
    + `<span class="t-arrow">&rarr;</span>`
    + `<span class="t-to">${esc(e.to)}</span> ${esc(e.message)}</div>`).join('')}</div>`;
}

// The backend's verdict is an enum (review_required / auto_approve_eligible).
// Translate it rather than printing the raw value at the reviewer.
function renderVerdict(dr) {
  const review = dr.hosts_review || 0;
  const total = dr.hosts_total || 0;
  const needsReview = dr.verdict === 'review_required';

  const title = needsReview
    ? 'Manual review required before remediation'
    : 'Eligible for automated remediation';
  const detail = needsReview
    ? `${review} of ${total} host${total === 1 ? '' : 's'} exceed the risk threshold `
      + `and must be approved by an operator.`
    : `No hosts exceed the risk threshold. Remediation can proceed unattended.`;

  return `<div class="verdict ${needsReview ? 'warn' : 'ok'}">
    <div class="v-title">${esc(title)}</div>
    <div class="v-detail">${esc(detail)}</div>
    <div class="v-meta">
      <span><span class="k">Maintenance window</span>${esc(dr.maintenance_window)}</span>
      <span><span class="k">Assessed by</span>cve-gather-info-agent</span>
    </div>
  </div>`;
}

function renderDryRun(s) {
  const dr = s.dry_run || {};
  const notes = (dr.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join('');
  const hosts = (s.hosts || []).map(h => `
    <tr>
      <td class="cve-id">${esc(h.host)}</td>
      <td class="cvss ${h.decision === 'review' ? 'high' : 'low'}">${esc(h.risk_score)}</td>
      <td><span class="badge ${h.decision}">${esc(h.decision)}</span></td>
      <td class="desc">${esc(h.history || h.reason)}</td>
    </tr>`).join('');

  document.getElementById('list').innerHTML = `
    <div class="run-head">
      <h3>Dry-run report &mdash; ${esc(dr.cve_id)}</h3>
      <button id="patch" class="go-patch">Start Patch</button>
      <button id="back" class="pill">&larr; CVE list</button>
    </div>
    <div class="result" id="patch-result"></div>
    <div id="patch-body"></div>
    <div class="stats">
      <div class="stat"><div class="v">${esc(dr.cvss)}</div><div class="k">CVSS</div></div>
      <div class="stat"><div class="v">${esc(dr.hosts_total)}</div><div class="k">Hosts</div></div>
      <div class="stat"><div class="v high">${esc(dr.hosts_review)}</div><div class="k">Review</div></div>
      <div class="stat"><div class="v low">${esc(dr.hosts_auto)}</div><div class="k">Auto</div></div>
      <div class="stat"><div class="v" style="font-size:14px">${esc(dr.risk_source)}</div><div class="k">Risk source</div></div>
      <div class="stat"><div class="v" style="font-size:14px">${esc(s.elapsed_s)}s</div><div class="k">Elapsed</div></div>
    </div>
    ${renderVerdict(dr)}
    ${notes}
    <div class="sev-block" style="margin-top:16px">
      <div class="sev-title high">Per-host assessment<span class="c">${(s.hosts||[]).length}</span></div>
      <table><thead><tr><th>Host</th><th>Risk</th><th>Decision</th><th>RAG history / reason</th></tr></thead>
      <tbody>${hosts}</tbody></table>
    </div>
    ${renderTrace(s.events)}
    <div class="note" style="margin-top:14px">Next: ${esc(s.next || 'n/a')}</div>`;
  document.getElementById('back').addEventListener('click', () => render());
  document.getElementById('patch').addEventListener('click', () => startRemediation(dr.cve_id));
}

const OUTCOME = {
  patched:           { cls: 'ok',     label: 'Patched' },
  awaiting_approval: { cls: 'review', label: 'Awaiting approval' },
  rejected:          { cls: 'fail',   label: 'Rejected' },
  running:           { cls: 'review', label: 'Running' },
  failed:            { cls: 'fail',   label: 'Failed' },
  timeout:           { cls: 'fail',   label: 'Timed out' },
};

let patchState = null;   // last /api/state payload, so rows can re-render in place

// Signals the AO approval gate. Buttons are disabled while in flight so a
// double click cannot send two decisions to the same activity.
async function decide(execId, activityId, decision) {
  const row = document.querySelector(`tr[data-exec="${execId}"]`);
  if (row) {
    row.querySelectorAll('button').forEach(b => { b.disabled = true; });
    const cell = row.querySelector('.decide-cell');
    if (cell) cell.innerHTML = '<span class="muted-sm">signalling…</span>';
  }
  try {
    const r = await fetch('/api/decide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ execution_id: execId, activity_id: activityId, decision }),
    });
    const d = await r.json().catch(() => ({}));
    if (!(r.ok && d.ok)) {
      if (row) row.querySelector('.decide-cell').innerHTML =
        `<span class="err-sm">${esc(d.error || 'failed')}</span>`;
      return;
    }
    if (patchState && patchState.patch) {
      for (const res of patchState.patch.results || []) {
        if (res.execution_id === execId) Object.assign(res, d);
      }
      recountPatch(patchState);
      renderPatch(patchState);
    }
  } catch (e) {
    if (row) row.querySelector('.decide-cell').innerHTML =
      `<span class="err-sm">${esc(e.message)}</span>`;
  }
}

const TERMINAL = ['patched', 'rejected', 'failed', 'timeout', 'cancelled'];
let trackTimer = null;

// A result row is a snapshot. A run that is still going can fail a moment
// later, so anything non-terminal is re-read from AO until it settles.
function trackPatchRuns() {
  clearInterval(trackTimer);
  let ticks = 0;
  trackTimer = setInterval(async () => {
    if (!patchState || !patchState.patch) { clearInterval(trackTimer); return; }
    const live = (patchState.patch.results || [])
      .filter(r => r.execution_id && !TERMINAL.includes(r.outcome));
    if (!live.length || ++ticks > 100) { clearInterval(trackTimer); return; }

    let changed = false;
    for (const r of live) {
      try {
        const d = await (await fetch(
          `/api/runs?execution_id=${encodeURIComponent(r.execution_id)}`)).json();
        if (d.ok && d.run && d.run.outcome !== r.outcome) {
          Object.assign(r, d.run);
          changed = true;
        }
      } catch { /* transient — try again next tick */ }
    }
    if (changed) { recountPatch(patchState); renderPatch(patchState); }
  }, 5000);
}

function recountPatch(s) {
  const rs = (s.patch || {}).results || [];
  s.patch.summary = {
    patched: rs.filter(r => r.outcome === 'patched').length,
    awaiting_approval: rs.filter(r => r.outcome === 'awaiting_approval').length,
    failed: rs.filter(r => ['failed', 'timeout'].includes(r.outcome)).length,
    rejected: rs.filter(r => ['rejected', 'cancelled'].includes(r.outcome)).length,
  };
}

function renderPatch(s) {
  patchState = s;
  // Non-terminal rows keep polling until they settle.
  setTimeout(trackPatchRuns, 0);
  const p = s.patch || {};
  const sum = p.summary || {};
  const rows = (p.results || []).map(r => {
    const o = OUTCOME[r.outcome] || { cls: 'review', label: r.outcome };
    const steps = (r.steps || []).filter(x => x.status && x.status !== 'skipped')
      .map(x => `${esc(x.name)}:${esc(x.status)}`).join(' · ');
    const canDecide = r.outcome === 'awaiting_approval' && r.approval_activity_id;
    const actions = canDecide
      ? `<button class="btn-approve" onclick="decide('${esc(r.execution_id)}','${esc(r.approval_activity_id)}','approved')">Approve</button>`
        + `<button class="btn-reject" onclick="decide('${esc(r.execution_id)}','${esc(r.approval_activity_id)}','rejected')">Reject</button>`
      : '<span class="muted-sm">&mdash;</span>';
    return `<tr data-exec="${esc(r.execution_id)}">
      <td class="cve-id">${esc(r.host)}</td>
      <td><span class="badge ${o.cls}">${esc(o.label)}</span></td>
      <td class="decide-cell">${actions}</td>
      <td class="desc">${steps || esc(r.error || '—')}</td>
      <td class="mono">${esc((r.execution_id || '').slice(0, 8))}</td>
    </tr>`;
  }).join('');

  document.getElementById('patch-body').innerHTML = `
    <div class="sev-title high" style="margin-top:18px">
      Patching Agent &mdash; ${esc(p.workflow)}<span class="c">${(p.results||[]).length}</span>
    </div>
    <div class="stats" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat"><div class="v low">${esc(sum.patched)}</div><div class="k">Patched</div></div>
      <div class="stat"><div class="v high">${esc(sum.awaiting_approval)}</div><div class="k">Awaiting approval</div></div>
      <div class="stat"><div class="v" style="color:var(--red)">${esc(sum.failed)}</div><div class="k">Failed</div></div>
      <div class="stat"><div class="v">${esc(sum.rejected || 0)}</div><div class="k">Rejected</div></div>
    </div>
    <table style="margin-top:10px">
      <thead><tr><th>Host</th><th>Outcome</th><th>Decision</th><th>Workflow steps</th><th>Exec</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="note">Each host triggers its own Ansible Orchestrator execution.
      Hosts routed to <code>approved_patch</code> pause at the approval gate in the AO console.</div>
    <div class="note">Next: ${esc(s.next || 'n/a')}</div>`;
}

// Hands the reviewed dry-run to the Patching Agent, which triggers the
// Ansible Orchestrator workflow once per host.
async function startRemediation(cveId) {
  const el = document.getElementById('patch-result');
  const btn = document.getElementById('patch');
  btn.disabled = true;
  el.className = 'result show info';
  el.innerHTML = `Handing <strong>${esc(cveId)}</strong> to the Patching Agent…`;
  try {
    const r = await fetch('/api/patch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cve: cveId }),
    });
    const d = await r.json().catch(() => ({}));
    if (!(r.ok && d.ok)) {
      el.className = 'result show err';
      el.innerHTML = `<strong>${esc(d.error || 'Could not start')}</strong>`
                   + (d.detail ? `<br>${esc(d.detail)}` : '');
      btn.disabled = false;
      return;
    }
    for (let i = 0; i < 300; i++) {
      await new Promise(x => setTimeout(x, 1000));
      let s;
      try { s = await (await fetch('/api/state')).json(); } catch { continue; }
      if (s.events && s.events.length) {
        const last = s.events[s.events.length - 1];
        el.className = 'result show info';
        el.innerHTML = `Patching <strong>${esc(cveId)}</strong>…<br>`
          + `<span style="opacity:.8">${esc(last.from)} &rarr; ${esc(last.to)}: ${esc(last.message)}</span>`;
      }
      if (s.status === 'complete' && s.patch) {
        const sm = s.patch.summary || {};
        el.className = 'result show ' + (sm.failed ? 'err' : 'ok');
        el.innerHTML = `Dispatched <strong>${esc(cveId)}</strong> — `
          + `${esc(sm.patched)} patched, ${esc(sm.awaiting_approval)} awaiting approval, `
          + `${esc(sm.failed)} failed.`;
        renderPatch(s);
        return;
      }
      if (s.status === 'failed') {
        const e = s.error || {};
        el.className = 'result show err';
        el.innerHTML = `<strong>${esc(e.service || 'Patching')} failed.</strong><br>${esc(e.detail)}`
                     + (e.fix ? `<br><br><strong>Fix:</strong> ${esc(e.fix)}` : '');
        return;
      }
    }
    el.className = 'result show err';
    el.innerHTML = 'Timed out waiting for the Patching Agent.';
  } catch (e) {
    el.className = 'result show err';
    el.innerHTML = 'Could not reach the backend: ' + esc(e.message);
  } finally {
    btn.disabled = false;
  }
}

async function poll(cve) {
  for (let i = 0; i < 180; i++) {
    await new Promise(r => setTimeout(r, 1000));
    let s;
    try { s = await (await fetch('/api/state')).json(); } catch { continue; }
    if (s.events && s.events.length) {
      const last = s.events[s.events.length - 1];
      show(`Running <strong>${esc(cve)}</strong>…<br>`
         + `<span style="opacity:.8">${esc(last.from)} &rarr; ${esc(last.to)}: ${esc(last.message)}</span>`, 'info');
    }
    if (s.status === 'complete') {
      show(`Dry-run complete for <strong>${esc(cve)}</strong> in ${esc(s.elapsed_s)}s.`, 'ok');
      renderDryRun(s);
      return;
    }
    if (s.status === 'failed') {
      const e = s.error || {};
      show(`<strong>${esc(e.service || 'Run')} failed.</strong><br>${esc(e.detail)}`
         + (e.fix ? `<br><br><strong>Fix:</strong> ${esc(e.fix)}` : ''), 'err');
      return;
    }
  }
  show('Timed out waiting for the run to finish.', 'err');
}

async function startPatch() {
  const cve = document.getElementById('cve').value.trim();
  if (!/^CVE-\d{4}-\d{4,}$/i.test(cve)) {
    show('Enter a CVE ID in the form <strong>CVE-2026-12405</strong>.', 'err');
    return;
  }
  const btn = document.getElementById('go');
  btn.disabled = true;
  show(`Starting <strong>${esc(cve)}</strong>…`, 'info');
  try {
    const r = await fetch('/api/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cve }),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      await poll(cve);
    } else if (r.status === 502) {
      // frontend/server.py proxies /api/start to the backend on :8787.
      show('No backend reachable — this page is in <strong>CVE-only mode</strong>. '
         + 'Start it with <code>./agentic-patching.py serve</code>.', 'err');
    } else {
      show('Could not start: ' + esc(d.error || `HTTP ${r.status}`), 'err');
    }
  } catch (e) {
    show('Could not start: ' + esc(e.message), 'err');
  } finally {
    btn.disabled = false;
  }
}

// ---- Patch runs view -----------------------------------------------------
// Read live from Ansible Orchestrator, so a run that failed after the console
// stopped polling shows its real status here rather than a stale one.

const RUN_OUTCOME = {
  patched:           { cls: 'ok',     label: 'Patched' },
  completed:         { cls: 'ok',     label: 'Completed' },
  rejected:          { cls: 'fail',   label: 'Rejected' },
  failed:            { cls: 'fail',   label: 'Failed' },
  cancelled:         { cls: 'fail',   label: 'Cancelled' },
  awaiting_approval: { cls: 'review', label: 'Awaiting approval' },
  running:           { cls: 'review', label: 'Running' },
};

const ago = iso => {
  if (!iso) return '—';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
};

async function showRuns() {
  document.getElementById('frame-title').textContent = 'Patch runs';
  document.getElementById('pills').style.display = 'none';
  const vt = document.getElementById('view-runs');
  vt.textContent = '← CVEs';
  vt.onclick = () => { vt.textContent = 'Patch runs'; vt.onclick = showRuns;
                       document.getElementById('pills').style.display = '';
                       document.getElementById('frame-title').textContent = 'CVEs';
                       render(); };

  const el = document.getElementById('list');
  el.innerHTML = '<div class="empty"><div class="spinner"></div><span>Loading runs from Ansible Orchestrator…</span></div>';
  let d;
  try { d = await (await fetch('/api/runs?limit=40')).json(); }
  catch (e) { el.innerHTML = `<div class="empty"><span>Could not load runs</span><span style="font-size:11px">${esc(e.message)}</span></div>`; return; }
  if (!d.ok) {
    el.innerHTML = `<div class="empty"><span>${esc(d.error || 'Could not load runs')}</span>`
                 + `<span style="font-size:11px">${esc(d.detail || '')}</span></div>`;
    return;
  }

  const runs = d.runs || [];
  const n = o => runs.filter(r => r.outcome === o).length;
  const rows = runs.map(r => {
    const o = RUN_OUTCOME[r.outcome] || { cls: 'review', label: r.outcome };
    const act = r.approval_pending && r.outcome === 'awaiting_approval'
      ? `<button class="btn-approve" onclick="decideRun('${esc(r.execution_id)}','approved')">Approve</button>`
        + `<button class="btn-reject" onclick="decideRun('${esc(r.execution_id)}','rejected')">Reject</button>`
      : '<span class="muted-sm">—</span>';
    return `<tr data-exec="${esc(r.execution_id)}">
      <td class="muted-sm" style="white-space:nowrap">${esc(ago(r.created_at))}</td>
      <td class="cve-id">${esc(r.cve_id)}</td>
      <td class="cve-id">${esc(r.host)}</td>
      <td>${esc(r.group)}</td>
      <td><span class="badge ${o.cls}">${esc(o.label)}</span></td>
      <td class="decide-cell">${act}</td>
      <td class="desc">${r.error ? `<span class="err-sm">${esc(String(r.error).slice(0,200))}</span>` : '—'}</td>
      <td class="mono">${esc((r.execution_id || '').slice(0, 8))}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="run-head">
      <h3>${esc(d.workflow)} &mdash; last ${runs.length} run(s)</h3>
      <button id="refresh-runs" class="pill">Refresh</button>
    </div>
    <div class="stats" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat"><div class="v low">${n('completed') + n('patched')}</div><div class="k">Completed</div></div>
      <div class="stat"><div class="v high">${n('awaiting_approval')}</div><div class="k">Awaiting approval</div></div>
      <div class="stat"><div class="v" style="color:var(--red)">${n('failed')}</div><div class="k">Failed</div></div>
      <div class="stat"><div class="v">${n('cancelled')}</div><div class="k">Cancelled</div></div>
      <div class="stat"><div class="v">${n('running')}</div><div class="k">Running</div></div>
    </div>
    ${runs.length ? `<table style="margin-top:12px">
      <thead><tr><th>When</th><th>CVE</th><th>Host</th><th>Branch</th><th>Outcome</th>
      <th>Decision</th><th>Error</th><th>Exec</th></tr></thead>
      <tbody>${rows}</tbody></table>`
    : '<div class="empty"><span>No patch runs yet.</span></div>'}
    <div class="note">Read live from Ansible Orchestrator — includes runs started outside this console.</div>`;
  document.getElementById('refresh-runs').addEventListener('click', showRuns);
}

// Approve/reject from the runs table. The activity id is fetched first, since
// the list endpoint does not carry it.
async function decideRun(execId, decision) {
  const row = document.querySelector(`tr[data-exec="${execId}"] .decide-cell`);
  if (row) row.innerHTML = '<span class="muted-sm">signalling…</span>';
  try {
    const det = await (await fetch(`/api/runs?execution_id=${encodeURIComponent(execId)}`)).json();
    const act = det.ok && det.run && det.run.approval_activity_id;
    if (!act) {
      if (row) row.innerHTML = '<span class="err-sm">no pending approval</span>';
      return;
    }
    const r = await fetch('/api/decide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ execution_id: execId, activity_id: act, decision }),
    });
    const d = await r.json().catch(() => ({}));
    if (!(r.ok && d.ok) && row) {
      row.innerHTML = `<span class="err-sm">${esc(d.error || 'failed')}</span>`;
      return;
    }
    showRuns();
  } catch (e) {
    if (row) row.innerHTML = `<span class="err-sm">${esc(e.message)}</span>`;
  }
}

document.getElementById('view-runs').addEventListener('click', showRuns);

document.getElementById('pills').addEventListener('click', e => {
  const p = e.target.closest('.pill');
  if (p) { filter = p.dataset.sev; render(); }
});
document.getElementById('go').addEventListener('click', startPatch);
document.getElementById('cve').addEventListener('keydown', e => { if (e.key === 'Enter') startPatch(); });

loadCves(0);
</script>
