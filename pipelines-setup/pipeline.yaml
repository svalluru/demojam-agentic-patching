# Applications v2: two pipelines. app-v2-test (Swap libraries, below) and app-v2-build (Rebuild from source, the
# second half of this file).
#
# app-v2-test, "test in a pod". Started by AAP (job template "App Patch v2 - Test in a Pod",
# aap-setup/playbooks/app_v2_test_pod.yml) for each app in a run, after the commit job has checked every jar and
# before the run reaches the approval gate or any site.
#
#   fetch   every jar the app runs, from its BOM with the change applied, each checked (sha256 from the commit job
#           for the changed jars, Maven Central's sha1 for the rest); the app (HealthServer.java); a Containerfile;
#           and an osv.dev re-query of the final jar set
#   build   OpenShift Pipelines' own buildah task: the image, pushed to the internal registry
#   test    the image runs as a sidecar; a step asks its /health and checks each changed library reports its new jar
#
# Results: passed (true|false), health (the /health body), osv_open (advisories still open on the final jar set),
# image (what was tested).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-v2-fetch
spec:
  params:
    - name: jars
      description: '[{"group","artifact","version","url","sha256"?}] every jar the app runs after the change (JSON)'
    - name: probes
    - name: port
  workspaces:
    - name: source
    - name: app
      description: the ConfigMap app-v2-healthserver (HealthServer.java)
  results:
    - name: osv_open
    - name: osv_detail
    - name: passed
      description: true|false (while build and health are disabled on this lab, by the rule in the step)
    - name: health
  steps:
    - name: fetch-check-scan
      image: registry.access.redhat.com/ubi9/python-311
      env:
        - { name: JARS, value: $(params.jars) }
        - { name: PROBES, value: $(params.probes) }
        - { name: PORT, value: $(params.port) }
      script: |
        #!/usr/bin/env python3
        import hashlib, json, os, pathlib, shutil, urllib.request
        src = pathlib.Path('$(workspaces.source.path)')
        lib = src / 'lib'
        lib.mkdir(parents=True, exist_ok=True)
        jars = json.loads(os.environ['JARS'])
        for j in jars:
            name = j['url'].rsplit('/', 1)[1]
            data = urllib.request.urlopen(j['url'], timeout=120).read()
            if j.get('sha256'):
                got = hashlib.sha256(data).hexdigest()
                assert got == j['sha256'], f"{name}: sha256 {got} is not the verified {j['sha256']}"
                how = 'sha256 (verified by the commit job)'
            else:
                want = urllib.request.urlopen(j['url'] + '.sha1', timeout=60).read().decode().split()[0]
                got = hashlib.sha1(data).hexdigest()
                assert got == want, f"{name}: sha1 {got} is not Maven Central's {want}"
                how = 'sha1 (Maven Central)'
            (lib / name).write_bytes(data)
            print(f'{name}: {len(data)} bytes, {how}')
        shutil.copy('$(workspaces.app.path)/HealthServer.java', src / 'HealthServer.java')
        (src / 'Containerfile').write_text(
            'FROM registry.access.redhat.com/ubi9/openjdk-17:latest\n'
            'COPY lib/ /deployments/lib/\n'
            'COPY HealthServer.java /deployments/HealthServer.java\n'
            f'ENV PORT={os.environ["PORT"]} PROBES={os.environ["PROBES"]}\n'
            'ENTRYPOINT ["java", "-cp", "/deployments/lib/*", "/deployments/HealthServer.java"]\n')
        # osv.dev, for the jar set the sites will run: what is still open once this change is in.
        body = json.dumps({'queries': [{'version': j['version'].split('.rhlw-')[0],
                                        'package': {'ecosystem': 'Maven', 'name': f"{j['group']}:{j['artifact']}"}}
                                       for j in jars if j.get('group')]}).encode()
        try:
            res = json.load(urllib.request.urlopen(urllib.request.Request(
                'https://api.osv.dev/v1/querybatch', body, {'Content-Type': 'application/json'}), timeout=60))
            open_ = {f"{j['artifact']} {j['version']}": len(r.get('vulns') or [])
                     for j, r in zip([j for j in jars if j.get('group')], res.get('results') or [])}
            # A Lightwell build is queried by its upstream version, so its own fixes still show here: the count is
            # an upper bound for those jars, exact for upstream ones.
            total, detail = str(sum(open_.values())), json.dumps({k: v for k, v in open_.items() if v})
        except Exception as exc:
            total, detail = 'unknown', json.dumps({'error': str(exc)[:200]})
        pathlib.Path('$(results.osv_open.path)').write_text(total)
        pathlib.Path('$(results.osv_detail.path)').write_text(detail[:1500])
        print('osv.dev on the final jar set:', total, detail)
        # While build and health are disabled on this lab (see the pipeline), the outcome follows a stated rule:
        # a change of Lightwell builds only passes; one that includes an upstream jar is reported as failing to
        # start. SIMULATED: the checksums above are real, the start-up is not run.
        changed = [j for j in jars if j.get('changed')]
        upstream_jars = [f"{j['artifact']} {j['version']}" for j in changed if '.rhlw-' not in j.get('version', '')]
        if upstream_jars:
            passed, health = 'false', {'status': 'DOWN', 'simulated': True,
                'note': 'simulated on this lab: a change that includes an upstream jar is reported as failing to start ('
                        + ', '.join(upstream_jars) + '); image build and /health check are disabled (node ephemeral storage)'}
        else:
            passed, health = 'true', {'status': 'NOT RUN', 'simulated': True,
                'note': 'image build and /health check disabled on this lab (node ephemeral storage); every jar verified'}
        health['jars_verified'] = [j['url'].rsplit('/', 1)[1] for j in jars]
        pathlib.Path('$(results.passed.path)').write_text(passed)
        pathlib.Path('$(results.health.path)').write_text(json.dumps(health)[:1500])
        print('SIMULATED test outcome on this lab:', passed, '-', health['note'])
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-v2-health
spec:
  params:
    - name: image
    - name: port
    - name: expect
      description: '{"library": "new jar name"} for each changed library (JSON)'
  results:
    - name: passed
    - name: health
  sidecars:
    - name: app
      image: $(params.image)
  steps:
    - name: check
      image: registry.access.redhat.com/ubi9/python-311
      env:
        - { name: PORT, value: $(params.port) }
        - { name: EXPECT, value: $(params.expect) }
      script: |
        #!/usr/bin/env python3
        import json, os, pathlib, time, urllib.request
        url = f"http://localhost:{os.environ['PORT']}/health"
        body, deadline = None, time.time() + 180
        while time.time() < deadline:
            try:
                body = json.load(urllib.request.urlopen(url, timeout=5))
                break
            except Exception:
                time.sleep(3)
        expect = json.loads(os.environ['EXPECT'])
        jars = (body or {}).get('jars') or {}
        wrong = {k: jars.get(k, 'missing') for k, v in expect.items() if jars.get(k) != v}
        passed = body is not None and body.get('status') == 'UP' and not wrong
        pathlib.Path('$(results.passed.path)').write_text('true' if passed else 'false')
        pathlib.Path('$(results.health.path)').write_text(json.dumps(body or {'error': 'no answer from /health'})[:1500])
        # Recorded, not raised: a failed task drops the pipeline's results, and the AAP job needs them to say why.
        print('health:', body, 'expected:', expect, 'wrong:', wrong)
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-v2-test
  annotations:
    # Read by the console's task strip: these tasks are commented out below and shown as skipped.
    app-v2/skipped-tasks: "build,health"
    app-v2/skipped-reason: "disabled on this lab: node ephemeral storage"
spec:
  params:
    - name: app
    - name: run_id
    - name: jars
    - name: probes
    - name: port
    - name: expect
  workspaces:
    - name: source
    - name: app
  results:
    # With build and health enabled, passed and health come from the health task and image from build:
    # - { name: passed, value: $(tasks.health.results.passed) }
    # - { name: health, value: $(tasks.health.results.health) }
    # - { name: image, value: $(tasks.build.results.IMAGE_URL) }
    - { name: passed, value: $(tasks.fetch.results.passed) }
    - { name: health, value: $(tasks.fetch.results.health) }
    - { name: osv_open, value: $(tasks.fetch.results.osv_open) }
    - { name: osv_detail, value: $(tasks.fetch.results.osv_detail) }
  tasks:
    - name: fetch
      taskRef: { name: app-v2-fetch }
      params:
        - { name: jars, value: $(params.jars) }
        - { name: probes, value: $(params.probes) }
        - { name: port, value: $(params.port) }
      workspaces:
        - { name: source, workspace: source }
        - { name: app, workspace: app }
    # ---- DISABLED ON THIS LAB ------------------------------------------------------------
    # The lab is a single node short of ephemeral storage: building the image (buildah) and running it
    # as a sidecar get the pod evicted. Uncomment these two tasks (and the results marked above) to build
    # the app with the change and check /health in a pod, and drop the app-v2/skipped-tasks annotation.
    # - name: build
    #   runAfter: [fetch]
    #   taskRef:
    #     resolver: cluster
    #     params:
    #       - { name: kind, value: task }
    #       - { name: name, value: buildah }
    #       - { name: namespace, value: openshift-pipelines }
    #   params:
    #     - name: IMAGE
    #       value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/app-v2-$(params.app):$(params.run_id)
    #     - { name: DOCKERFILE, value: ./Containerfile }
    #     - { name: TLSVERIFY, value: "false" }
    #   workspaces:
    #     - { name: source, workspace: source }
    # - name: health
    #   runAfter: [build]
    #   taskRef: { name: app-v2-health }
    #   params:
    #     - name: image
    #       value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/app-v2-$(params.app):$(params.run_id)
    #     - { name: port, value: $(params.port) }
    #     - { name: expect, value: $(params.expect) }
---
# Applications v2, "Rebuild from source": the app's Gitea repository, cloned; the change list applied to pom.xml with
# Applications v1's apply_dependency_changes.py; mvn package (dependencies through the Nexus proxies); the built app
# and every resolved jar as one bundle in Nexus maven-releases, which the sites then deploy; the same image build and
# /health check as the library swap.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-v2-update-pom
spec:
  params:
    - name: changes
      description: '[{"name": "group:artifact", "from", "to"}] (JSON)'
  workspaces:
    - name: source
    - name: tools
      description: the ConfigMap app-v2-tools (apply_dependency_changes.py)
  steps:
    - name: apply
      image: registry.access.redhat.com/ubi9/python-311
      env:
        - { name: CHANGES, value: $(params.changes) }
      script: |
        #!/usr/bin/env python3
        import json, os, subprocess, sys
        src = '$(workspaces.source.path)/repo'
        changes = [dict(c, manifests=['pom.xml']) for c in json.loads(os.environ['CHANGES'])]
        open('/tmp/changes.json', 'w').write(json.dumps(changes))
        out = subprocess.run([sys.executable, '$(workspaces.tools.path)/apply_dependency_changes.py', '--root', src,
                              '--changes', '/tmp/changes.json'], capture_output=True, text=True)
        print(out.stdout, out.stderr)
        report = json.loads(out.stdout or '[]')
        missed = [r['name'] for r in report if not r.get('applied')]
        if out.returncode or missed:
            raise SystemExit(f'pom.xml not updated for: {missed or "see above"}')
        subprocess.run(['git', '-C', src, '--no-pager', 'diff', '--stat'], check=False)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: app-v2-package
spec:
  params:
    - name: app
    - name: run_id
    - name: nexus_url
    - name: probes
    - name: port
    - name: changes
      default: "[]"
  workspaces:
    - name: source
  results:
    - name: bundle_url
    - name: bundle_sha256
    - name: osv_open
    - name: osv_detail
    - name: passed
    - name: health
  steps:
    - name: mvn-package
      image: registry.access.redhat.com/ubi9/openjdk-17
      workingDir: $(workspaces.source.path)/repo
      env:
        - { name: HOME, value: $(workspaces.source.path) }
        - name: NEXUS_USER
          valueFrom: { secretKeyRef: { name: app-v2-nexus, key: username } }
        - name: NEXUS_PASSWORD
          valueFrom: { secretKeyRef: { name: app-v2-nexus, key: password } }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        N="$(params.nexus_url)"
        cat > "$HOME/settings.xml" <<XML
        <settings>
          <mirrors><mirror><id>nexus-central</id><mirrorOf>central</mirrorOf><url>$N/repository/maven-central/</url></mirror></mirrors>
          <profiles><profile><id>lightwell</id><repositories><repository><id>lightwell-remediated</id>
            <url>$N/repository/lightwell-remediated/</url></repository></repositories></profile></profiles>
          <activeProfiles><activeProfile>lightwell</activeProfile></activeProfiles>
        </settings>
        XML
        mvn -B -ntp -s "$HOME/settings.xml" -Dmaven.repo.local="$HOME/.m2" package \
            dependency:list -DoutputFile="$HOME/deps.txt" -DincludeScope=runtime
        # The bundle the sites deploy: every resolved jar, plus the app's own.
        rm -rf "$HOME/bundle" "$HOME/ctx" && mkdir -p "$HOME/bundle/lib" "$HOME/ctx/lib"
        cp target/lib/*.jar "target/$(params.app).jar" "$HOME/bundle/lib/"
        tar -C "$HOME/bundle" -czf "$HOME/bundle.tgz" lib
        SHA=$(sha256sum "$HOME/bundle.tgz" | cut -d' ' -f1)
        P="com/lab/appv2/$(params.app)-bundle/$(params.run_id)/$(params.app)-bundle-$(params.run_id).tgz"
        curl -fsS -k -u "$NEXUS_USER:$NEXUS_PASSWORD" --upload-file "$HOME/bundle.tgz" "$N/repository/maven-releases/$P"
        printf '%s' "$N/repository/maven-releases/$P" > "$(results.bundle_url.path)"
        printf '%s' "$SHA" > "$(results.bundle_sha256.path)"
        # The image build context: the same layout as the library swap.
        cp "$HOME/bundle/lib/"*.jar "$HOME/ctx/lib/"
        cp src/main/java/HealthServer.java "$HOME/ctx/"
        printf 'FROM registry.access.redhat.com/ubi9/openjdk-17:latest\nCOPY lib/ /deployments/lib/\nCOPY HealthServer.java /deployments/HealthServer.java\nENV PORT=%s PROBES=%s\nENTRYPOINT ["java", "-cp", "/deployments/lib/*", "/deployments/HealthServer.java"]\n' \
            "$(params.port)" "$(params.probes)" > "$HOME/ctx/Containerfile"
        echo "bundle $P sha256 $SHA: $(ls "$HOME/bundle/lib" | wc -l) jars"
    - name: osv-rescan
      image: registry.access.redhat.com/ubi9/python-311
      script: |
        #!/usr/bin/env python3
        # osv.dev for the jar set Maven resolved (deps.txt: group:artifact:jar:version:scope).
        import json, pathlib, re, urllib.request
        lines = pathlib.Path('$(workspaces.source.path)/deps.txt').read_text().splitlines()
        coords = []
        for l in lines:
            m = re.match(r'\s*([\w.\-]+):([\w.\-]+):jar:([\w.\-]+):\w+', l)
            if m:
                coords.append((m.group(1), m.group(2), m.group(3)))
        body = json.dumps({'queries': [{'version': v.split('.rhlw-')[0], 'package': {'ecosystem': 'Maven', 'name': f'{g}:{a}'}}
                                       for g, a, v in coords]}).encode()
        try:
            res = json.load(urllib.request.urlopen(urllib.request.Request('https://api.osv.dev/v1/querybatch', body,
                                                                          {'Content-Type': 'application/json'}), timeout=60))
            counts = {f'{a} {v}': len(r.get('vulns') or []) for (g, a, v), r in zip(coords, res.get('results') or [])}
            total, detail = str(sum(counts.values())), json.dumps({k: n for k, n in counts.items() if n})
        except Exception as exc:
            total, detail = 'unknown', json.dumps({'error': str(exc)[:200]})
        pathlib.Path('$(results.osv_open.path)').write_text(total)
        pathlib.Path('$(results.osv_detail.path)').write_text(detail[:1500])
        print(len(coords), 'resolved jars; osv.dev', total, detail)
        # Build and health are disabled on this lab (see the pipeline): the outcome follows the same stated rule as
        # the library swap. SIMULATED: mvn package above is real, the start-up is not run.
        changes = json.loads('''$(params.changes)''' or '[]')
        upstream_jars = [f"{c['name'].split(':')[-1]} {c['to']}" for c in changes if '.rhlw-' not in str(c.get('to', ''))]
        if upstream_jars:
            passed, health = 'false', {'status': 'DOWN', 'simulated': True,
                'note': 'simulated on this lab: a change that includes an upstream jar is reported as failing to start ('
                        + ', '.join(upstream_jars) + '); image build and /health check are disabled (node ephemeral storage)'}
        else:
            passed, health = 'true', {'status': 'NOT RUN', 'simulated': True,
                'note': 'image build and /health check disabled on this lab (node ephemeral storage); mvn package passed'}
        pathlib.Path('$(results.passed.path)').write_text(passed)
        pathlib.Path('$(results.health.path)').write_text(json.dumps(health)[:1500])
        print('SIMULATED test outcome on this lab:', passed, '-', health['note'])
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: app-v2-build
  annotations:
    app-v2/skipped-tasks: "build,health"
    app-v2/skipped-reason: "disabled on this lab: node ephemeral storage"
spec:
  params:
    - name: app
    - name: run_id
    - name: repo_url
    - name: changes
    - name: nexus_url
    - name: probes
    - name: port
    - name: expect
  workspaces:
    - name: source
    - name: tools
  results:
    # With build and health enabled:
    # - { name: passed, value: $(tasks.health.results.passed) }
    # - { name: health, value: $(tasks.health.results.health) }
    # - { name: image, value: $(tasks.build.results.IMAGE_URL) }
    - { name: passed, value: $(tasks.package.results.passed) }
    - { name: health, value: $(tasks.package.results.health) }
    - { name: osv_open, value: $(tasks.package.results.osv_open) }
    - { name: osv_detail, value: $(tasks.package.results.osv_detail) }
    - { name: bundle_url, value: $(tasks.package.results.bundle_url) }
    - { name: bundle_sha256, value: $(tasks.package.results.bundle_sha256) }
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - { name: kind, value: task }
          - { name: name, value: git-clone }
          - { name: namespace, value: openshift-pipelines }
      params:
        - { name: URL, value: $(params.repo_url) }
        - { name: REVISION, value: main }
        - { name: SUBDIRECTORY, value: repo }
        - { name: SSL_VERIFY, value: "false" }
      workspaces:
        - { name: output, workspace: source }
    - name: update-pom
      runAfter: [clone]
      taskRef: { name: app-v2-update-pom }
      params:
        - { name: changes, value: $(params.changes) }
      workspaces:
        - { name: source, workspace: source }
        - { name: tools, workspace: tools }
    - name: package
      runAfter: [update-pom]
      taskRef: { name: app-v2-package }
      params:
        - { name: app, value: $(params.app) }
        - { name: run_id, value: $(params.run_id) }
        - { name: nexus_url, value: $(params.nexus_url) }
        - { name: probes, value: $(params.probes) }
        - { name: port, value: $(params.port) }
        - { name: changes, value: $(params.changes) }
      workspaces:
        - { name: source, workspace: source }
    # ---- DISABLED ON THIS LAB ------------------------------------------------------------
    # The lab is a single node short of ephemeral storage: building the image (buildah) and running it
    # as a sidecar get the pod evicted. Uncomment these two tasks (and the results marked above) to build
    # the app with the change and check /health in a pod, and drop the app-v2/skipped-tasks annotation.
    # - name: build
    #   runAfter: [package]
    #   taskRef:
    #     resolver: cluster
    #     params:
    #       - { name: kind, value: task }
    #       - { name: name, value: buildah }
    #       - { name: namespace, value: openshift-pipelines }
    #   params:
    #     - name: IMAGE
    #       value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/app-v2-$(params.app):$(params.run_id)
    #     - { name: CONTEXT, value: ./ctx }
    #     - { name: DOCKERFILE, value: ./ctx/Containerfile }
    #     - { name: TLSVERIFY, value: "false" }
    #   workspaces:
    #     - { name: source, workspace: source }
    # - name: health
    #   runAfter: [build]
    #   taskRef: { name: app-v2-health }
    #   params:
    #     - name: image
    #       value: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/app-v2-$(params.app):$(params.run_id)
    #     - { name: port, value: $(params.port) }
    #     - { name: expect, value: $(params.expect) }
