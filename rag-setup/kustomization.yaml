apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace here. deploy.sh applies with -n "$NAMESPACE" from .env, and a
# namespace written in this file overrode that: setting NAMESPACE to anything
# else failed with "the namespace from the provided object does not match".
# .env is the one place it is set.

resources:
  - milvus/
  - llamastack/

labels:
  - pairs:
      app.kubernetes.io/part-of: rag-setup
    includeSelectors: false
