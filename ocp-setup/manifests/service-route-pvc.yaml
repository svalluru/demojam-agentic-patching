apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cve-console-state
  labels:
    app: cve-console
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cve-console
  labels:
    app: cve-console
spec:
  # The frontend only. The backend port is deliberately absent — see the
  # comment on the backend container.
  selector:
    app: cve-console
  ports:
    - name: http
      port: 8788
      targetPort: 8788
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cve-console
  labels:
    app: cve-console
  annotations:
    # An assessment against a cold CVE takes tens of seconds, and a
    # dispatch holds the connection while AO works through the workflow.
    # The 30s default cuts those off mid-request.
    haproxy.router.openshift.io/timeout: 900s
spec:
  to:
    kind: Service
    name: cve-console
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
