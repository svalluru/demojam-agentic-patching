---
# Deploy an Applications v2 sample app to the lab hosts, on the vulnerable log4j 2.24.3 that the Lightwell build
# 2.24.3.rhlw-00004 replaces. Run by aap-setup/create-app-v2-objects.py --deploy-sample (job template
# "App Patch v2 - Deploy Sample App"), or by hand:
#
#   ansible-playbook -i <inventory> aap-setup/playbooks/app_v2_deploy_sample.yml -e @app.json
# where app.json gives app_name, app_port, target_hosts, jars (Maven Central paths) and probes. The telco apps:
#   nfvo-orchestrator  port 8090  node1,node2,node3  mina-core 2.2.5, zookeeper 3.5.9, spring-security-web 5.7.11
#   oss-inventory      port 8091  node1,node3        postgresql 42.3.3, zookeeper 3.5.9, mina-core 2.1.6
# create-app-v2-objects.py --deploy-sample launches both.
#
# The layout matches app-data/bom/<app_name>.json, which is what the inventory agent reads:
#   /opt/apps/<app_name>/HealthServer.java      the app (source launcher, nothing to build)
#   /opt/apps/<app_name>/lib/*.jar              its dependencies, swapped by the generated playbooks
#   /opt/apps/<app_name>/backup/                where a generated playbook keeps the jar it replaced
#   systemd unit <app_name>, GET http://localhost:<app_port>/health
- name: Deploy an Applications v2 sample app
  hosts: "{{ target_hosts | default('node1,node2,node3') }}"
  become: true
  gather_facts: false
  vars:
    app_name: sample-app
    app_port: 8080
    app_dir: "/opt/apps/{{ app_name }}"
    central: https://repo1.maven.org/maven2
    # Maven Central paths. The defaults are the original sample app's; the telco apps pass their own.
    jars:
      - { path: org/apache/logging/log4j/log4j-api/2.24.3/log4j-api-2.24.3.jar }
      - { path: org/apache/logging/log4j/log4j-core/2.24.3/log4j-core-2.24.3.jar }
      - { path: commons-io/commons-io/2.11.0/commons-io-2.11.0.jar }
    # name=class pairs: /health names the jar each class loads from.
    probes: "log4j-core=org.apache.logging.log4j.core.LoggerContext"
  tasks:
    - name: Install a JDK (the source launcher needs javac's compiler, which the headless JRE lacks)
      ansible.builtin.dnf:
        name: java-17-openjdk-devel
        state: present

    - name: Create the app layout
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: ["{{ app_dir }}", "{{ app_dir }}/lib", "{{ app_dir }}/backup"]

    - name: Fetch the published checksums from Maven Central
      ansible.builtin.uri:
        url: "{{ central }}/{{ item.path }}.sha1"
        return_content: true
      loop: "{{ jars }}"
      register: sums
      delegate_to: localhost
      become: false

    - name: Download the dependencies, checked against those checksums
      ansible.builtin.get_url:
        url: "{{ central }}/{{ item.item.path }}"
        dest: "{{ app_dir }}/lib/{{ item.item.path | basename }}"
        checksum: "sha1:{{ item.content | trim | split(' ') | first }}"
        mode: "0644"
      loop: "{{ sums.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Install the app
      ansible.builtin.copy:
        src: files/HealthServer.java
        dest: "{{ app_dir }}/HealthServer.java"
        mode: "0644"

    - name: Install the systemd unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Applications v2 sample app ({{ app_name }})
          After=network.target

          [Service]
          Environment=PORT={{ app_port }}
          Environment=PROBES={{ probes }}
          ExecStart=/usr/bin/java -cp '{{ app_dir }}/lib/*' {{ app_dir }}/HealthServer.java
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Start it
      ansible.builtin.systemd_service:
        name: "{{ app_name }}"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Check it answers
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        return_content: true
      register: health
      until: health.status == 200
      retries: 20
      delay: 3

    - name: Show which jars it loaded
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} {{ app_name }}: {{ health.json.jars }}"
