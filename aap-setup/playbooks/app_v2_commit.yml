---
# Applications v2, first node of the AO workflow "App Patch v2": verify the Lightwell build, then commit the generated
# playbook to Gitea. Job template "App Patch v2 - Commit to Gitea" (aap-setup/create-app-v2-objects.py).
#
# Runs on the controller's execution environment (localhost). Nothing here touches an application server.
#
#   1. The playbook the console generated arrives base64-encoded; its sha256 must match the one the console computed,
#      so a playbook altered on the way is never committed.
#   2. Every jar in the change is downloaded through Nexus and checked before anything is committed:
#      - a Lightwell build: its provenance bundle is verified with cosign against Red Hat's PNC Provenance Signing
#        Key 1 (Configure Lightwell Network, "Verify provenance for Java artifacts");
#      - an upstream release (an osv.dev fix): its sha1 must match the one Maven Central publishes.
#      A jar that does not check out is not committed, so it can never reach the gate.
#   3. The playbook, and the fixed runner app_v2_run.yml that the Sync and Run job imports it through, are committed to
#      the Gitea repository through its contents API (the same way the lab's own Fetch and Commit job writes to Gitea).
#
# Variables (from the AO trigger):
#   playbook_b64, playbook_sha256, playbook_filename   the generated playbook and where it goes in the repository
#   gitea_repo                                         owner/name, default lab-user/app_v2_playbooks
#   jars_json                                          the change: [{new_jar, url, source: lightwell|upstream,
#                                                      provenance_url | sha1_url}] (JSON). Older triggers send
#                                                      jar_url and provenance_url for one Lightwell build.
#   app, run_id                                        for the commit message
#   init_only                                          true: commit only app_v2_run.yml (create-app-v2-objects.py runs
#                                                      this once, so the Sync and Run template has a playbook to name)
#
# Gitea access comes from the environment, injected by the credential attached to the template (the lab's own Gitea
# "Gitea API" credential, which create-app-v2-objects.py reuses): GITEA_URL and GITEA_TOKEN. The token is never
# printed.
#
# Reports with set_stats: playbook_filename, commit_sha, commit_url, jar_sha256s_json ({new_jar: sha256}),
# jar_sha256 (the first jar's), provenance_verified (every Lightwell jar verified), upstream_checked.
- name: App Patch v2 - verify the build and commit the playbook
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gitea_repo: lab-user/app_v2_playbooks
    gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') | default('', true) }}"
    gitea_token: "{{ lookup('ansible.builtin.env', 'GITEA_TOKEN') | default(lookup('ansible.builtin.env', 'GITEA_PASSWORD'), true) }}"
    work: "/tmp/app-v2-{{ run_id | default('run') }}-{{ app | default('app') }}"
    cosign_version: v3.1.4
    cosign_sha256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
    require_provenance: true
  tasks:
    - name: Check the Gitea credential
      ansible.builtin.assert:
        that: [gitea_url | length > 0, gitea_token | length > 0]
        fail_msg: The template needs a credential that injects GITEA_URL and GITEA_TOKEN (or GITEA_PASSWORD).

    - name: Check the inputs
      ansible.builtin.assert:
        that:
          - playbook_b64 | default('') | length > 0
          - playbook_sha256 | default('') | length == 64
          - playbook_filename is match('^app-v2/[A-Za-z0-9._-]+\.yml$')
          - (jars_json | default('') | length > 0) or (jar_url | default('') | length > 0)
        fail_msg: The trigger must send the playbook, its sha256, its filename and the jars.
      when: not (init_only | default(false) | bool)

    - name: Start from a clean working directory
      ansible.builtin.file:
        path: "{{ work }}"
        state: "{{ item }}"
        mode: "0700"
      loop: [absent, directory]

    - name: Verify the playbook and the build
      when: not (init_only | default(false) | bool)
      block:
        - name: Write the generated playbook
          ansible.builtin.copy:
            content: "{{ playbook_b64 | b64decode }}"
            dest: "{{ work }}/playbook.yml"
            mode: "0644"

        - name: Read its checksum
          ansible.builtin.stat:
            path: "{{ work }}/playbook.yml"
            checksum_algorithm: sha256
          register: pb

        - name: The playbook is the one the console generated
          ansible.builtin.assert:
            that: pb.stat.checksum == playbook_sha256
            fail_msg: "playbook sha256 {{ pb.stat.checksum }} does not match {{ playbook_sha256 }}; not committing it"

        # Ansible's own parser, which the console does not have. A playbook that does not parse is never
        # committed, so it can never reach the gate or a host.
        - name: The playbook parses
          ansible.builtin.command:
            argv: [ansible-playbook, --syntax-check, -i, "localhost,", "{{ work }}/playbook.yml",
                   -e, target_hosts=localhost]
          changed_when: false

        - name: The jars in this change
          ansible.builtin.set_fact:
            jars: >-
              {{ (jars_json if jars_json is not string else (jars_json | from_json)) if jars_json | default('') | length > 0
                 else [{'new_jar': jar_url | basename, 'url': jar_url, 'source': 'lightwell',
                        'provenance_url': provenance_url | default(jar_url | regex_replace('\\.jar$', '.provenance.sigstore.json'))}] }}

        - name: Download each jar through Nexus
          ansible.builtin.get_url:
            url: "{{ item.url }}"
            dest: "{{ work }}/{{ item.new_jar }}"
            mode: "0644"
          loop: "{{ jars }}"
          loop_control: { label: "{{ item.new_jar }}" }

        # Upstream releases carry no Red Hat provenance: they are checked against the sha1 Maven Central publishes.
        - name: Read Maven Central's sha1 for each upstream jar
          ansible.builtin.uri:
            url: "{{ item.sha1_url | default(item.url ~ '.sha1') }}"
            return_content: true
          loop: "{{ jars | selectattr('source', 'equalto', 'upstream') | list }}"
          loop_control: { label: "{{ item.new_jar }}" }
          register: published_sha1

        - name: Read each upstream jar's sha1
          ansible.builtin.stat:
            path: "{{ work }}/{{ item.item.new_jar }}"
            checksum_algorithm: sha1
          loop: "{{ published_sha1.results }}"
          loop_control: { label: "{{ item.item.new_jar }}" }
          register: upstream_sha1

        - name: Each upstream jar is the one Maven Central published
          ansible.builtin.assert:
            that: item.stat.checksum == (item.item.content | trim | split(' ') | first)
            fail_msg: "{{ item.item.item.new_jar }} does not match Maven Central's sha1; not committing"
          loop: "{{ upstream_sha1.results }}"
          loop_control: { label: "{{ item.item.item.new_jar }}" }

        - name: Download each Lightwell build's provenance bundle
          ansible.builtin.get_url:
            url: "{{ item.provenance_url }}"
            dest: "{{ work }}/{{ item.new_jar }}.provenance.sigstore.json"
            mode: "0644"
          loop: "{{ jars | selectattr('source', 'equalto', 'lightwell') | list }}"
          loop_control: { label: "{{ item.new_jar }}" }
          register: prov_dl
          failed_when: require_provenance | bool and prov_dl is failed
          ignore_errors: "{{ not (require_provenance | bool) }}"

        - name: Look for cosign
          ansible.builtin.command: cosign version
          register: cosign_present
          changed_when: false
          failed_when: false

        - name: Fetch cosign, pinned to its published checksum
          ansible.builtin.get_url:
            url: "https://github.com/sigstore/cosign/releases/download/{{ cosign_version }}/cosign-linux-amd64"
            dest: "{{ work }}/cosign"
            checksum: "sha256:{{ cosign_sha256 }}"
            mode: "0755"
          when: cosign_present.rc != 0

        - name: Write Red Hat's PNC Provenance Signing Key 1
          ansible.builtin.copy:
            src: files/pnc-provenance-signing-key-1.pub
            dest: "{{ work }}/pnc.pub"
            mode: "0644"

        # Sigstore bundle v0.3 (dsseEnvelope), which cosign 3 reads by default; 2.4 could not parse it.
        - name: Verify each Lightwell build's SLSA provenance
          ansible.builtin.command:
            argv:
              - "{{ 'cosign' if cosign_present.rc == 0 else work ~ '/cosign' }}"
              - verify-blob-attestation
              - --type
              - https://slsa.dev/provenance/v1
              - --key
              - "{{ work }}/pnc.pub"
              - --bundle
              - "{{ work }}/{{ item.item.new_jar }}.provenance.sigstore.json"
              - "{{ work }}/{{ item.item.new_jar }}"
          loop: "{{ prov_dl.results }}"
          loop_control: { label: "{{ item.item.new_jar }}" }
          register: provenance
          changed_when: false
          failed_when: require_provenance | bool and provenance.rc != 0
          when: item is succeeded

        - name: Checksum of each checked jar
          ansible.builtin.stat:
            path: "{{ work }}/{{ item.new_jar }}"
            checksum_algorithm: sha256
          loop: "{{ jars }}"
          loop_control: { label: "{{ item.new_jar }}" }
          register: jar_stats

        - name: Note the checksums
          ansible.builtin.set_fact:
            jar_sha256s: "{{ dict(jar_stats.results | map(attribute='item.new_jar') | zip(jar_stats.results | map(attribute='stat.checksum'))) }}"
            provenance_ok: >-
              {{ (provenance.results | default([]) | length) > 0 and
                 (provenance.results | rejectattr('rc', 'defined') | list | length) == 0 and
                 (provenance.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list | length) == 0 }}

    # Gitea's contents API, as the lab's own Fetch and Commit job does: a token header, no username, no git binary
    # and no credentials in a clone URL. One commit per file; the runner is only rewritten when it changed.
    - name: Files to commit
      ansible.builtin.set_fact:
        to_commit: >-
          {{ ([{'path': 'app_v2_run.yml', 'content': lookup('ansible.builtin.file', 'files/app_v2_run.yml')}])
             + ([] if init_only | default(false) | bool else
                [{'path': playbook_filename, 'content': playbook_b64 | b64decode}]) }}

    - name: Read what the repository holds now
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ gitea_repo }}/contents/{{ item.path }}"
        headers: { Authorization: "token {{ gitea_token }}" }
        status_code: [200, 404]
        validate_certs: false
      loop: "{{ to_commit }}"
      loop_control: { label: "{{ item.path }}" }
      register: current
      no_log: true

    - name: Commit each file that is new or changed
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ gitea_repo }}/contents/{{ item.item.path }}"
        method: "{{ 'PUT' if item.status == 200 else 'POST' }}"
        headers: { Authorization: "token {{ gitea_token }}" }
        body_format: json
        body: >-
          {{ {'content': item.item.content | b64encode,
              'message': 'App Patch v2: ' ~ ('add the runner' if item.item.path == 'app_v2_run.yml'
                         else (app | default('app')) ~ ' run ' ~ (run_id | default('')) ~ ' (' ~ item.item.path ~ ')')}
             | combine({'sha': item.json.sha} if item.status == 200 else {}) }}
        status_code: [200, 201]
        validate_certs: false
      loop: "{{ current.results }}"
      loop_control: { label: "{{ item.item.path }}" }
      when: item.status == 404 or (item.json.content | default('') | b64decode) != item.item.content
      register: committed
      no_log: true

    - name: The commit that holds the playbook
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ gitea_repo }}/commits?limit=1&path={{ to_commit[-1].path | urlencode }}"
        headers: { Authorization: "token {{ gitea_token }}" }
        validate_certs: false
      register: last
      no_log: true

    - name: Note it
      ansible.builtin.set_fact:
        pushed: { stdout_lines: ["{{ last.json[0].sha }}"] }

    - name: Report the commit
      ansible.builtin.set_stats:
        data:
          playbook_filename: "{{ playbook_filename | default('') }}"
          commit_sha: "{{ pushed.stdout_lines[-1] }}"
          commit_url: "{{ gitea_url }}/{{ gitea_repo }}/src/commit/{{ pushed.stdout_lines[-1] }}/{{ playbook_filename | default('app_v2_run.yml') }}"
          jar_sha256s_json: "{{ (jar_sha256s | default({})) | to_json }}"
          jar_sha256: "{{ (jar_stats.results | default([{}]))[0].stat.checksum | default('') }}"
          provenance_verified: "{{ provenance_ok | default(false) | bool }}"
          upstream_checked: "{{ upstream_sha1.results | default([]) | map(attribute='item.item.new_jar') | list }}"

  post_tasks:
    - name: Remove the working directory
      ansible.builtin.file:
        path: "{{ work }}"
        state: absent
