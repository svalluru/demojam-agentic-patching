---
# Applications v2, second node of the AO workflow "App Patch v2": test the change in a pod before any site.
# Job template "App Patch v2 - Test in a Pod" (aap-setup/create-app-v2-objects.py). Runs on localhost.
#
# Starts one PipelineRun per app and run, app-v2-<app>-<run_id>, of pipeline app-v2-test (Swap libraries) or
# app-v2-build (Rebuild from source; pipelines-setup/pipeline.yaml), through the Kubernetes API
# (ansible.builtin.uri: no collection needed), waits for it, and fails unless the app came up on the new jars. Every
# jar the app runs is checked again inside the pipeline: the changed ones against the sha256 the commit job verified,
# the rest against Maven Central's sha1. The tested jar set is also written as a CycloneDX SBOM and committed to Gitea
# beside the playbook.
#
# Variables (from the AO workflow):
#   app, run_id, playbook_filename
#   lib_json        every jar the app runs after the change: [{group, artifact, version, url, changed}] (JSON)
#   sha256s_json    {new jar name: sha256} from the commit job (JSON)
#   probes, port    the app's /health probes and port
#   expect_json     {library: new jar name} for the changed libraries (JSON)
#   gitea_repo
#   test_mode       swap (default): the jars into the image (pipeline app-v2-test)
#                   source: clone repo, apply changes_json to pom.xml, mvn package (pipeline app-v2-build); after a
#                   pass, branch fix/<run_id> with the pom.xml change is pushed to the app's Gitea repository
#   repo            owner/name of the app's Gitea repository (source mode)
#   changes_json    [{name: group:artifact, from, to}] (source mode)
#   nexus_url       the Nexus the build resolves through (source mode)
# Environment, from the credentials attached to the template: OCP_API_URL, OCP_TOKEN, OCP_NAMESPACE (the
# "App Patch v2 OpenShift" credential) and GITEA_URL, GITEA_TOKEN (the lab's Gitea API credential). Neither token is
# printed.
#
# Reports with set_stats: test_passed, test_image, test_health, osv_open, osv_detail, pipelinerun, sbom_url,
# sha256s_json (what the run step pins: the commit job's jar checksums, or the built bundle's), bundle_url, branch_url.
- name: App Patch v2 - test the change in a pod
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ocp_url: "{{ lookup('ansible.builtin.env', 'OCP_API_URL') | default('https://kubernetes.default.svc', true) }}"
    ocp_token: "{{ lookup('ansible.builtin.env', 'OCP_TOKEN') }}"
    ocp_ns: "{{ lookup('ansible.builtin.env', 'OCP_NAMESPACE') | default('agentic-patching', true) }}"
    gitea_url: "{{ lookup('ansible.builtin.env', 'GITEA_URL') | default('', true) }}"
    gitea_token: "{{ lookup('ansible.builtin.env', 'GITEA_TOKEN') | default(lookup('ansible.builtin.env', 'GITEA_PASSWORD'), true) }}"
    gitea_repo: lab-user/app_v2_playbooks
    lib: "{{ lib_json if lib_json is not string else (lib_json | from_json) }}"
    mode: "{{ test_mode | default('swap', true) }}"
    changes: "{{ (changes_json if changes_json is not string else (changes_json | from_json)) if changes_json | default('') | length > 0 else [] }}"
    branch: "fix/{{ run_id }}"
    sums: "{{ sha256s_json if sha256s_json is mapping else (sha256s_json | from_json) }}"
    # One test per app per run: every site of the app in this run uses the same name, so the first site's execution
    # creates the PipelineRun and the others find it (409) and wait on it instead of building the same image again.
    run_name: "{{ ('app-v2-' ~ app ~ '-' ~ run_id) | lower | regex_replace('[^a-z0-9-]', '-') | truncate(63, true, '') | regex_replace('-+$', '') }}"
  tasks:
    - name: Check the inputs and the OpenShift credential
      ansible.builtin.assert:
        that:
          - ocp_token | length > 0
          - app | default('') | length > 0
          - lib | length > 0
        fail_msg: Needs the "App Patch v2 OpenShift" credential (OCP_TOKEN) and app, lib_json from the workflow.

    - name: Attach each changed jar's verified sha256
      ansible.builtin.set_fact:
        tested: "{{ (tested | default([])) + [item | combine({'sha256': sums[item.url | basename]} if item.changed | default(false) else {})] }}"
      loop: "{{ lib }}"
      loop_control: { label: "{{ item.url | basename }}" }

    # One expression for the whole body: Ansible turns a template that renders to JSON back into a list or dict, and
    # Tekton's params here are strings. Built in one go, the inner to_json results stay strings.
    - name: Start the pipeline
      ansible.builtin.uri:
        url: "{{ ocp_url }}/apis/tekton.dev/v1/namespaces/{{ ocp_ns }}/pipelineruns"
        method: POST
        headers: { Authorization: "Bearer {{ ocp_token }}" }
        validate_certs: false
        body_format: json
        status_code: [201, 409]
        body: >-
          {{ {'apiVersion': 'tekton.dev/v1', 'kind': 'PipelineRun',
              'metadata': {'name': run_name,
                           'labels': {'app-v2/app': app, 'app-v2/run': run_id | string, 'app-v2/mode': mode}},
              'spec': ({'pipelineRef': {'name': 'app-v2-build'},
                        'params': [{'name': 'app', 'value': app},
                                   {'name': 'run_id', 'value': run_id | string},
                                   {'name': 'repo_url', 'value': gitea_url ~ '/' ~ repo ~ '.git'},
                                   {'name': 'changes', 'value': changes | to_json},
                                   {'name': 'nexus_url', 'value': nexus_url | string},
                                   {'name': 'probes', 'value': probes | string},
                                   {'name': 'port', 'value': port | string},
                                   {'name': 'expect', 'value': expect_json if expect_json is string else (expect_json | to_json)}],
                        'workspaces': [{'name': 'source', 'volumeClaimTemplate': {'spec': {
                                           'accessModes': ['ReadWriteOnce'], 'resources': {'requests': {'storage': '2Gi'}}}}},
                                       {'name': 'tools', 'configMap': {'name': 'app-v2-tools'}}]}
                       if mode == 'source' else
                       {'pipelineRef': {'name': 'app-v2-test'},
                        'params': [{'name': 'app', 'value': app},
                                   {'name': 'run_id', 'value': run_id | string},
                                   {'name': 'jars', 'value': tested | to_json},
                                   {'name': 'probes', 'value': probes | string},
                                   {'name': 'port', 'value': port | string},
                                   {'name': 'expect', 'value': expect_json if expect_json is string else (expect_json | to_json)}],
                        'workspaces': [{'name': 'source', 'volumeClaimTemplate': {'spec': {
                                           'accessModes': ['ReadWriteOnce'], 'resources': {'requests': {'storage': '1Gi'}}}}},
                                       {'name': 'app', 'configMap': {'name': 'app-v2-healthserver'}}]})} }}
      register: created
      no_log: true

    - name: Note whether this site started the test or joined one already running
      ansible.builtin.debug:
        msg: >-
          {{ 'Started PipelineRun ' ~ run_name if created.status == 201
             else 'PipelineRun ' ~ run_name ~ ' already started by another site of ' ~ app ~ '; waiting on it' }}

    - name: Wait for it
      ansible.builtin.uri:
        url: "{{ ocp_url }}/apis/tekton.dev/v1/namespaces/{{ ocp_ns }}/pipelineruns/{{ run_name }}"
        headers: { Authorization: "Bearer {{ ocp_token }}" }
        validate_certs: false
      register: pr
      until: >-
        (pr.json.status.conditions | default([]) | selectattr('type', 'equalto', 'Succeeded')
         | map(attribute='status') | first | default('Unknown')) in ['True', 'False']
      retries: 180
      delay: 10
      no_log: true

    - name: Read the outcome
      ansible.builtin.set_fact:
        cond: "{{ pr.json.status.conditions | selectattr('type', 'equalto', 'Succeeded') | first }}"
        results: "{{ dict((pr.json.status.results | default([])) | map(attribute='name') | zip((pr.json.status.results | default([])) | map(attribute='value'))) }}"

    - name: The tested jar set, as a CycloneDX SBOM
      ansible.builtin.set_fact:
        sbom:
          bomFormat: CycloneDX
          specVersion: "1.5"
          metadata:
            component: { type: application, name: "{{ app }}", version: "{{ run_id }}" }
            properties: [{ name: "app-v2:pipelinerun", value: "{{ run_name }}" }]
          components: []

    - name: Fill in the components
      ansible.builtin.set_fact:
        sbom: >-
          {{ sbom | combine({'components': sbom.components + [{
               'type': 'library', 'group': item.group, 'name': item.artifact, 'version': item.version,
               'purl': 'pkg:maven/' ~ item.group ~ '/' ~ item.artifact ~ '@' ~ item.version,
               'hashes': ([{'alg': 'SHA-256', 'content': item.sha256}] if item.sha256 is defined else [])}]}) }}
      loop: "{{ tested }}"
      loop_control: { label: "{{ item.artifact }}" }

    - name: Commit the SBOM beside the playbook
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/repos/{{ gitea_repo }}/contents/{{ playbook_filename | regex_replace('\\.yml$', '.sbom.json') }}"
        method: POST
        headers: { Authorization: "token {{ gitea_token }}" }
        body_format: json
        body:
          content: "{{ sbom | to_nice_json | b64encode }}"
          message: "App Patch v2: {{ app }} run {{ run_id }} tested jar set (SBOM)"
        status_code: [201, 422]
        validate_certs: false
      when: gitea_url | length > 0 and gitea_token | length > 0 and playbook_filename | default('') | length > 0
      register: sbom_commit
      failed_when: false
      no_log: true

    # Source mode, after a pass: the pom.xml change that was built and tested, on branch fix/<run> of the app's repo.
    # The same apply_dependency_changes.py the pipeline ran, on the copy Gitea holds. Nothing is merged.
    - name: Push branch {{ branch }} with the pom.xml change
      when: mode == 'source' and cond.status == 'True' and results.passed | default('false') == 'true'
      block:
        - name: Create the branch from main (already there is fine)
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ repo }}/branches"
            method: POST
            headers: { Authorization: "token {{ gitea_token }}" }
            body_format: json
            body: { new_branch_name: "{{ branch }}", old_branch_name: main }
            status_code: [201, 409]
            validate_certs: false
          no_log: true

        - name: Read pom.xml on the branch
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ repo }}/contents/pom.xml?ref={{ branch | urlencode }}"
            headers: { Authorization: "token {{ gitea_token }}" }
            validate_certs: false
          register: pom
          no_log: true

        - name: Work directory
          ansible.builtin.tempfile: { state: directory }
          register: tmp

        - name: Write it and the change list
          ansible.builtin.copy:
            dest: "{{ tmp.path }}/{{ item.name }}"
            content: "{{ item.content }}"
            mode: "0600"
          loop:
            - { name: pom.xml, content: "{{ pom.json.content | b64decode }}" }
            - { name: changes.json, content: "{{ changes | map('combine', {'manifests': ['pom.xml']}) | list | to_json }}" }
          loop_control: { label: "{{ item.name }}" }

        - name: Apply the change list
          ansible.builtin.command:
            argv: [python3, "{{ playbook_dir }}/files/apply_dependency_changes.py", --root, "{{ tmp.path }}", --changes, "{{ tmp.path }}/changes.json"]
          changed_when: true

        - name: Commit pom.xml to the branch
          ansible.builtin.uri:
            url: "{{ gitea_url }}/api/v1/repos/{{ repo }}/contents/pom.xml"
            method: PUT
            headers: { Authorization: "token {{ gitea_token }}" }
            body_format: json
            body:
              branch: "{{ branch }}"
              sha: "{{ pom.json.sha }}"
              content: "{{ lookup('ansible.builtin.file', tmp.path ~ '/pom.xml') | b64encode }}"
              message: >-
                App Patch v2 run {{ run_id }}: {{ changes | map(attribute='name') | map('regex_replace', '^[^:]*:', '') | join(', ') }}
                to {{ changes | map(attribute='to') | join(', ') }} (built, tested in a pod, deployed)
            status_code: [200, 201]
            validate_certs: false
          register: branch_commit
          no_log: true

    - name: Report the test
      ansible.builtin.set_stats:
        data:
          test_passed: "{{ cond.status == 'True' and results.passed | default('false') == 'true' }}"
          test_image: "{{ results.image | default('') }}"
          test_health: "{{ results.health | default('') }}"
          osv_open: "{{ results.osv_open | default('unknown') }}"
          osv_detail: "{{ results.osv_detail | default('') }}"
          pipelinerun: "{{ run_name }}"
          test_reason: "{{ cond.message | default('') | truncate(300) }}"
          test_mode: "{{ mode }}"
          bundle_url: "{{ results.bundle_url | default('') }}"
          sha256s_json: >-
            {{ ({(results.bundle_url | default('') | basename): results.bundle_sha256 | default('')} if mode == 'source'
                else sums) | to_json }}
          branch_url: "{{ (gitea_url ~ '/' ~ repo ~ '/src/branch/' ~ branch) if branch_commit is defined and branch_commit is succeeded and branch_commit is not skipped else '' }}"
          sbom_url: >-
            {{ (gitea_url ~ '/' ~ gitea_repo ~ '/src/branch/main/' ~ (playbook_filename | regex_replace('\.yml$', '.sbom.json')))
               if (sbom_commit.status | default(0)) in [201, 422] else '' }}

    - name: Stop here unless the app came up on the new jars
      ansible.builtin.assert:
        that:
          - cond.status == 'True'
          - results.passed | default('false') == 'true'
        fail_msg: >-
          The test in a pod did not pass ({{ run_name }}): {{ cond.message | default('') | truncate(200) }}
          {{ results.health | default('') | truncate(300) }}
