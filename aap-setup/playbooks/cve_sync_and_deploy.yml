---
# Make the freshly committed remediation playbook runnable, and tell Ansible
# Orchestrator what to launch.
#
# Successor to ao-setup/playbooks/cve_sync_and_deploy.yml, which referred to
# three AAP objects that do not exist in this controller (project
# Lightspeed-Playbooks, inventory lab-inventory, credential lab-credential) and
# passed a bare filename as the playbook, when the file lives in a subdirectory
# of the repository.
#
# Runs in two steps:
#   1. sync the project that tracks the generated-playbooks branch, so the file
#      committed moments ago by 'CVE - Fetch and Commit' is actually on disk
#   2. create (or update) a per-CVE-per-host job template pointing at it, and
#      publish its name for the orchestrator's next node to launch
#
# It creates a template; it does not run it. Running is the orchestrator's
# next node, deliberately separate so the thing that changes a machine is its
# own reviewable step.
#
# Needs a 'Red Hat Ansible Automation Platform' credential attached, which is
# what lets the ansible.controller modules authenticate back to the controller.
- name: Sync generated playbooks and create the CVE remediation template
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Project tracking the branch that 'CVE - Fetch and Commit' writes to.
    lightspeed_project: "{{ lightspeed_project | default('Lightspeed-Playbooks') }}"
    playbooks_dir: "{{ playbooks_dir | default('generated_playbooks') }}"
    # Where the remediation will run. Both must already exist in the
    # controller; this play will not invent infrastructure.
    target_inventory: "{{ target_inventory | default('Demo Inventory') }}"
    machine_credential: "{{ machine_credential | default('Demo Credential') }}"
    validate_certs: false

  tasks:
    - name: Work out the playbook path inside the project
      # The fetch step publishes playbook_path; older callers pass only
      # playbook_filename. Accept either rather than make the orchestrator
      # node change in lockstep.
      ansible.builtin.set_fact:
        resolved_playbook: >-
          {{ playbook_path if (playbook_path is defined and playbook_path)
             else (playbooks_dir ~ '/' ~ playbook_filename) }}

    - name: Fail early if no playbook was named
      ansible.builtin.fail:
        msg: >-
          Neither playbook_path nor playbook_filename was supplied. This runs
          after 'CVE - Fetch and Commit', which publishes both as artifacts —
          an empty value here usually means that step was skipped or its
          artifacts were not passed through.
      when: resolved_playbook | trim in ('', '/')

    - name: Sync the generated-playbooks project
      ansible.controller.project_update:
        name: "{{ lightspeed_project }}"
        wait: true
        timeout: 180
        validate_certs: "{{ validate_certs }}"
      register: sync_result

    - name: Create or update the per-host remediation template
      ansible.controller.job_template:
        name: "CVE Remediation - {{ cve_id }} - {{ target_host }}"
        job_type: run
        project: "{{ lightspeed_project }}"
        playbook: "{{ resolved_playbook }}"
        inventory: "{{ target_inventory }}"
        # The generated playbook says 'hosts: all'; this is what confines it
        # to the one machine the CVE was assessed against.
        limit: "{{ target_host }}"
        become_enabled: true
        credentials:
          - "{{ machine_credential }}"
        state: present
        validate_certs: "{{ validate_certs }}"
      register: jt_result

    - name: Report what was prepared
      ansible.builtin.debug:
        msg: >-
          template 'CVE Remediation - {{ cve_id }} - {{ target_host }}'
          (id {{ jt_result.id }}) runs {{ resolved_playbook }}
          from {{ lightspeed_project }}, limited to {{ target_host }}

    # run_cve_remediation_prod launches ${deploy_script_prod.artifacts.template_name}.
    - name: Publish artifacts for the orchestrator
      ansible.builtin.set_stats:
        data:
          template_name: "CVE Remediation - {{ cve_id }} - {{ target_host }}"
          template_id: "{{ jt_result.id }}"
          playbook_used: "{{ resolved_playbook }}"
          status: ready
