apiVersion: apps/v1
kind: Deployment
metadata:
  name: cve-console
  labels:
    app: cve-console
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the pod writes to one RWO volume, and a
  # rolling update would hold two pods needing it at once — the new one
  # stays Pending and the rollout never finishes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cve-console
  template:
    metadata:
      labels:
        app: cve-console
    spec:
      containers:
        # One process serves the page, the API and /lightwell/ on 8788.
        # There used to be a second container in front proxying /api/* to
        # this one on 127.0.0.1. That never kept the API private — it
        # forwarded every route, /api/decide included — so it is gone. The
        # API has no authentication: whoever can open the Route can approve
        # a patch, exactly as before.
        - name: console
          image: cve-console:latest
          command: ["./agentic-patching.py", "serve"]
          envFrom:
            - configMapRef:
                name: cve-console-config
            - secretRef:
                name: cve-console-secrets
          ports:
            - containerPort: 8788
              name: http
          volumeMounts:
            - name: state
              mountPath: /opt/app-root/src/runs
              subPath: runs
            - name: state
              mountPath: /opt/app-root/src/reports
              subPath: reports
          # httpGet works now: the process binds 0.0.0.0 (CONSOLE_HOST, set
          # by deploy.sh), so the kubelet can reach it on the pod IP.
          readinessProbe:
            httpGet: { path: /healthz, port: 8788 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8788 }
            # Slack on purpose. /healthz shares the interpreter with
            # assessment work, and a live run holds it for minutes; a tight
            # probe would restart the pod mid-patch.
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: cve-console-state
